# Regenerates the checked-in CoreCLR WebAssembly call helpers for this leg's target OS
# (src/coreclr/vm/wasm/<os>/callhelpers-*.cpp) from the testhost and crossgen2 the leg just built,
# and fails if they differ from what is committed. A stale table builds fine but crashes the
# corerun that links it, for example with "GetUnmanagedCallersOnlyThunk: unknown thunk" when a
# new [UnmanagedCallersOnly] method is missing. See src/coreclr/vm/wasm/generate-coreclr-helpers.md.
#
# Must run after a clr+libs build of osGroup (browser or wasi) in buildConfig on a Linux host.
parameters:
  osGroup: ''
  osSubgroup: ''
  archType: ''
  buildConfig: ''
  runtimeFlavor: ''
  runtimeVariant: ''
  helixQueues: ''
  targetRid: ''
  nameSuffix: ''
  platform: ''
  shouldContinueOnError: false

steps:
  - bash: |
      set -u
      target_os='${{ parameters.osGroup }}'
      configuration='$(_BuildConfig)'
      table_dir="src/coreclr/vm/wasm/$target_os/"

      src/coreclr/vm/wasm/generate-coreclr-helpers.sh -c "$configuration" --target-os "$target_os"
      generator_exit=$?
      if [[ $generator_exit -ne 0 ]]; then
        echo "##vso[task.logissue type=error]Regenerating the $target_os CoreCLR WebAssembly call helpers failed (exit $generator_exit)."
        exit $generator_exit
      fi

      if [[ -z "$(git status --porcelain -- "$table_dir")" ]]; then
        echo "The checked-in $target_os call helpers are up to date."
        exit 0
      fi

      echo "##vso[task.logissue type=error]The checked-in CoreCLR WebAssembly call helpers in $table_dir are out of date. Regenerate them and commit the result; see the step log for the diff and the commands."
      git --no-pager status --short -- "$table_dir"
      git --no-pager diff -- "$table_dir"
      echo
      echo "The managed code that feeds these tables ([UnmanagedCallersOnly] methods, P/Invokes, QCalls)"
      echo "changed without the tables being regenerated. To fix, run from the repository root:"
      echo
      echo "  ./build.sh clr+libs -os $target_os -c $configuration"
      echo "  src/coreclr/vm/wasm/generate-coreclr-helpers.sh -c $configuration --target-os $target_os"
      echo
      echo "and commit the changes under $table_dir."
      exit 1
    displayName: Check ${{ parameters.osGroup }} CoreCLR call helpers are up to date
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  # Use the existing wasm32 product and ordinary host compiler for these host tests.
  # Only the second IL CoreLib is built for wasm64: native wasm64 requires the
  # separately tracked LLVM memory64 table-assembly fix and is not enabled here.
  - ${{ if and(eq(parameters.osGroup, 'browser'), eq(parameters.archType, 'wasm')) }}:
    - bash: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)"

        ./build.sh -ci -os browser -arch wasm64 -c Release -rf CoreCLR -subset clr.corelib

        export DOTNET_HOST_PATH="${DOTNET_INSTALL_DIR:-$PWD/.dotnet}/dotnet"
        export WASM64_PORTABLE_HELPER_TESTS=1
        export WASM32_CORELIB_PATH="$PWD/artifacts/bin/coreclr/browser.wasm.Release/IL/System.Private.CoreLib.dll"
        export WASM64_CORELIB_PATH="$PWD/artifacts/bin/coreclr/browser.wasm64.Release/IL/System.Private.CoreLib.dll"
        test -x "$DOTNET_HOST_PATH"
        test -f "$WASM32_CORELIB_PATH"
        test -f "$WASM64_CORELIB_PATH"

        python3 eng/wasm/tests/test_target_selection.py -v
        python3 eng/wasm/tests/test_corelib_target.py -v

        results_dir="$PWD/artifacts/TestResults/wasm64-portable-helpers"
        mkdir -p "$results_dir"
        rm -f "$results_dir/portable-helpers.trx"
        ./dotnet.sh test src/coreclr/tools/aot/ILCompiler.ReadyToRun.Tests/ILCompiler.ReadyToRun.Tests.csproj \
          -c Release -p:TargetOS=browser -p:TargetArchitecture=wasm -p:RuntimeFlavor=CoreCLR \
          -p:CoreCLRConfiguration=Release -p:LibrariesConfiguration=Release \
          -p:ContinuousIntegrationBuild=true \
          --filter 'FullyQualifiedName~WasmPortableHelperTargetTests' \
          --logger 'trx;LogFileName=portable-helpers.trx' --results-directory "$results_dir"

        python3 - "$results_dir/portable-helpers.trx" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        counters = ET.parse(sys.argv[1]).find('.//{*}ResultSummary/{*}Counters')
        expected = {'total': 26, 'executed': 26, 'passed': 26, 'failed': 0, 'notExecuted': 0}
        if counters is None or any(int(counters.get(name, '-1')) != value for name, value in expected.items()):
            raise SystemExit(f'Expected 26 passing portable-helper cases with no skips; got {None if counters is None else counters.attrib}')
        print('All 26 Wasm32/Wasm64 portable-helper, transition and string-factory cases passed without skips.')
        PY
      displayName: Check Wasm32 and Wasm64 host lowering and portable helpers
      condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
